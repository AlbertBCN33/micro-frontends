name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    main:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  # `nx affected` compares against the base commit, so it needs history.
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # Sets NX_BASE/NX_HEAD: the last green commit on main, or the PR base.
            - uses: nrwl/nx-set-shas@v4

            # Local Nx cache persisted between runs: unchanged projects replay their
            # lint/test/build results instead of re-running. (Nx Cloud would share it
            # across machines and developers; this keeps the repo free of accounts.)
            - uses: actions/cache@v4
              with:
                  path: .nx/cache
                  key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            - run: npx nx format:check

            - run: npm run i18n:check

            - run: npx nx affected -t lint typecheck test build --parallel=3

            # e2e needs a browser; install only when the e2e project is affected.
            - name: Check if e2e is affected
              id: e2e
              run: |
                  if npx nx show projects --affected --with-target e2e | grep -q .; then
                    echo "affected=true" >> "$GITHUB_OUTPUT"
                  fi

            - if: steps.e2e.outputs.affected == 'true'
              run: npx playwright install --with-deps chromium

            - if: steps.e2e.outputs.affected == 'true'
              run: npx nx affected -t e2e

            - if: failure() && steps.e2e.outputs.affected == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: dist/.playwright
                  retention-days: 7
