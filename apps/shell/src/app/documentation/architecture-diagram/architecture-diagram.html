<figure class="figure">
	<svg
		class="diagram"
		viewBox="0 0 760 420"
		role="img"
		aria-labelledby="arch-title arch-desc"
	>
		<title id="arch-title">{{ 'DOCS.DIAGRAM.TITLE' | translate }}</title>
		<desc id="arch-desc">{{ 'DOCS.DIAGRAM.DESC' | translate }}</desc>
		<defs>
			<marker
				id="arrow"
				viewBox="0 0 10 10"
				refX="9"
				refY="5"
				markerWidth="7"
				markerHeight="7"
				orient="auto-start-reverse"
			>
				<path d="M0 0 10 5 0 10z" class="arrow-head" />
			</marker>
		</defs>

		<!-- Shell -->
		<rect
			x="250"
			y="20"
			width="260"
			height="110"
			rx="12"
			class="box box--host"
		/>
		<text x="380" y="50" class="label label--strong">shell · :4200</text>
		<text x="380" y="74" class="label">layout · router · root i18n</text>
		<text x="380" y="96" class="label">RemoteLoader</text>
		<text x="380" y="118" class="label label--muted">
			federation.manifest.json
		</text>

		<!-- Remotes -->
		<rect x="40" y="200" width="250" height="90" rx="12" class="box" />
		<text x="165" y="232" class="label label--strong">market · :4201</text>
		<text x="165" y="256" class="label">exposes ./routes</text>
		<text x="165" y="278" class="label label--muted">
			catalog · detail · i18n/en|es
		</text>

		<rect x="470" y="200" width="250" height="90" rx="12" class="box" />
		<text x="595" y="232" class="label label--strong">
			wishlist · :4202
		</text>
		<text x="595" y="256" class="label">exposes ./routes</text>
		<text x="595" y="278" class="label label--muted">
			saved items · i18n/en|es
		</text>

		<path
			d="M300 130 190 198"
			class="edge edge--lazy"
			marker-end="url(#arrow)"
		/>
		<path
			d="M460 130 570 198"
			class="edge edge--lazy"
			marker-end="url(#arrow)"
		/>
		<text x="210" y="160" class="label label--muted">
			{{ 'DOCS.DIAGRAM.ON_NAVIGATION' | translate }}
		</text>
		<text x="550" y="160" class="label label--muted">
			{{ 'DOCS.DIAGRAM.ON_NAVIGATION' | translate }}
		</text>

		<!-- Shared libraries -->
		<rect
			x="40"
			y="330"
			width="680"
			height="70"
			rx="12"
			class="box box--shared"
		/>
		<text x="380" y="358" class="label label--strong">
			{{ 'DOCS.DIAGRAM.SHARED' | translate }}
		</text>
		<text x="380" y="382" class="label">
			&#64;mfe/shared-ui · &#64;mfe/shared-util-i18n ·
			&#64;mfe/shared-data-access-wishlist
		</text>

		<path d="M165 290v38" class="edge" marker-end="url(#arrow)" />
		<path d="M595 290v38" class="edge" marker-end="url(#arrow)" />
		<path d="M380 130v198" class="edge" marker-end="url(#arrow)" />
	</svg>
	<figcaption>{{ 'DOCS.DIAGRAM.CAPTION' | translate }}</figcaption>
</figure>

<ul class="legend">
	<li>{{ 'DOCS.DIAGRAM.LEGEND_LAZY' | translate }}</li>
	<li>{{ 'DOCS.DIAGRAM.LEGEND_SHARED' | translate }}</li>
	<li>{{ 'DOCS.DIAGRAM.LEGEND_MANIFEST' | translate }}</li>
</ul>
